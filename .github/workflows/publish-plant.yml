name: Publish saved plant data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plant-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.IAG_PUBLICATION_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mirror public revisions and verify source hashes
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/publish-plant.mjs
      - name: Validate published facility snapshots
        run: npx tsx scripts/verify-publication.ts
      - name: Commit saved plant data
        run: |
          git config user.name "Industrial Asset Graph publication"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/facility-state/
          if ! git diff --cached --quiet; then
            git commit -m "Publish saved plant revisions and evidence"
            git push origin HEAD:main
          fi
      # The owner-authorized publication token triggers normal CI and Pages on push.
