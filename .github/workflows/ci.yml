name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install visual test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Verify facility data
        run: npm run verify:data

      - name: Verify permanent visual contract
        run: npm run verify:visual-contract

      - name: Build
        env:
          VITE_IAG_PUBLICATION: 'true'
          # Synthetic endpoint; Playwright intercepts Auth requests, never real credentials.
          VITE_SUPABASE_URL: https://iag-auth-test.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-visual-test-key
        run: npm run build

      - name: Run dashboard visual verification
        run: npm run test:visual

      - name: Verify Map Studio workflows
        run: npm run test:map-editor

      - name: Verify shared publication across browsers
        run: npm run test:publication

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-audit
          path: artifacts/*.png
          if-no-files-found: warn
