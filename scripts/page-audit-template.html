<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industrial Asset Graph — page audit</title>
<style>
:root{font:20px/1.5 system-ui;color:#f5f1e6;background:#152a35}*{box-sizing:border-box}body{margin:0;overflow-wrap:anywhere}header{padding:24px 4vw;background:#213e49;border-bottom:2px solid #72969c}h1{font-size:clamp(30px,4vw,48px);margin:0}h2{font-size:30px}h3{font-size:24px}p{max-width:90ch}button,input,select{font:inherit;color:inherit;background:#294954;border:1px solid #7b999f;border-radius:9px;min-height:52px;padding:10px 16px;max-width:100%}button{cursor:pointer;text-align:left}button:hover,button[aria-current=true]{background:#96d6c8;color:#102b32}a{color:#a8e9dd}input{width:100%}.summary{color:#addbd2}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;padding:24px 3vw}nav{min-width:0}nav button{display:block;width:100%;margin:8px 0}main{min-width:0}.card{padding:20px;border:1px solid #597780;border-radius:12px;margin-bottom:20px;background:#203b46}.issue{border-left:6px solid #f1ac75}.muted{color:#bad0d3}small{font-size:16px}.pills{display:flex;flex-wrap:wrap;gap:10px}.diagram{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start}.diagram button{display:block;width:100%;margin:8px 0;overflow-wrap:anywhere}.center{margin-top:50px;border:2px solid #96d6c8;padding:20px;text-align:center;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.gallery img{display:block;max-width:100%;height:auto;border:1px solid #799399}.gallery a{display:block}table{width:100%;border-collapse:collapse}td,th{text-align:left;vertical-align:top;border-bottom:1px solid #587580;padding:10px;overflow-wrap:anywhere}details{margin:16px 0}summary{cursor:pointer;padding:12px;background:#294954;border-radius:8px;min-height:52px}code{overflow-wrap:anywhere;font-size:.85em}.scroll{overflow:auto}svg{display:block;width:100%;height:50px}label{display:block;margin:12px 0}input[type=checkbox]{width:24px;min-height:24px;vertical-align:middle}.broken{color:#ffd1ae}.toplinks{display:flex;gap:20px;flex-wrap:wrap}footer{padding:20px 4vw}#page-list{max-height:76vh;overflow:auto}#findings a{display:block}li{margin:8px 0}@media(max-width:800px){.layout{display:block;padding:16px}#page-list{max-height:240px;margin-bottom:24px}.diagram{grid-template-columns:1fr}.center{margin:0}.diagram svg{display:none}.gallery{grid-template-columns:1fr}header{padding:20px}td,th{padding:6px;font-size:17px}}:focus-visible{outline:3px solid #fff;outline-offset:4px}
</style>
<header><h1>Every page. Where it goes. What works.</h1><p id="meta"></p><p class="summary" id="counts"></p><div class="toplinks"><a href="#findings">Audit findings</a><a href="audit-data.json">Raw evidence JSON</a><a href="../../docs/page-audit/README.md">Written syllabus</a></div></header>
<div class="layout"><nav aria-label="Audit page catalogue"><label for="search">Find a page</label><input id="search" placeholder="Search purpose or page name"><div id="page-list"></div></nav><main><section class="card issue" id="findings"><h2>Findings to address first</h2><div id="issue-list"></div></section><section id="detail"></section></main></div><footer>This is a local evidence report. Links in the graph explore the audit; they do not change production records.</footer>
<script>
const D=/*AUDIT_DATA*/;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='home',shared=false;
const title=id=>D.nodes.find(n=>n.id===id)?.title||id;
$('#meta').textContent=`Reviewed draft ${D.manifest.commit.slice(0,7)} · integration/live baseline at audit start ${D.manifest.baseline.slice(0,7)}. Different versions. Local fixtures; production behavior unverified.`;
$('#counts').textContent=`${D.summary.pages} pages · ${D.summary.screens} states · ${D.summary.states} desktop/phone captures · ${D.summary.screenshots} screenshots · ${D.summary.clickPass} representative link clicks passed`;
$('#issue-list').innerHTML=D.findings.map(f=>`<details><summary>${esc(f.id+' · '+f.priority+' · '+f.title)}</summary><p>${esc(f.detail)}</p><p>${esc(f.fix)}</p>${f.evidence.map(x=>`<a href="${esc(x)}" target="_blank">Open evidence: ${esc(x)}</a>`).join('')}</details>`).join('');
function catalogue(){const q=$('#search').value.toLowerCase();$('#page-list').innerHTML=D.nodes.filter(n=>(n.title+' '+n.purpose+' '+n.id).toLowerCase().includes(q)).map(n=>`<button data-page="${n.id}" aria-current="${n.id===selected}">${esc(n.title)}<br><small>${esc(n.id)}</small></button>`).join('')}
function choose(id){selected=id;location.hash='page='+id;render();catalogue();$('#detail').scrollIntoView({block:'start'})}
function edgeButtons(edges,dir){const groups=new Map();for(const e of edges){const key=dir==='in'?e.from:e.to;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)}return [...groups].map(([id,es])=>`<button data-page="${esc(id)}">${dir==='in'?'':'→ '}${esc(title(id))}${dir==='in'?' →':''}<br><small>${esc([...new Set(es.map(e=>e.evidence))].join(', '))} · ${es.length} control/link variants</small></button>`).join('')||'<p class="muted">No captured edges in this view.</p>'}
function render(){const n=D.nodes.find(n=>n.id===selected)||D.nodes[0];const allowed=e=>shared||!(['Directory','My work','Account'].includes(e.label)||e.label.startsWith('IAG'));const outgoing=D.edges.filter(e=>e.from===n.id&&allowed(e)),incoming=D.edges.filter(e=>e.to===n.id&&allowed(e));const rows=D.results.filter(r=>n.screens.includes(r.screen));const acts=D.actions.filter(a=>a.pages.includes(n.id));
$('#detail').innerHTML=`<section class="card"><h2>${esc(n.title)}</h2><p>${esc(n.purpose)}</p><p><b>Visual:</b> ${esc(n.visual)}</p><p><b>Functional:</b> ${esc(n.functional)}</p><p><b>Direct-link Back fallback:</b> <code>${esc(n.parent)}</code>. Recorded in-app Back follows the previous page.</p><label><input type="checkbox" id="shared" ${shared?'checked':''}> Include shared Home / Account / My work edges</label><div class="diagram"><div><h3>Comes from</h3>${edgeButtons(incoming,'in')}</div><div><svg viewBox="0 0 200 40" aria-hidden="true"><path d="M0 20H185m-15-10 15 10-15 10" fill="none" stroke="#96d6c8" stroke-width="3"/></svg><div class="center">${esc(n.title)}<br><small>${esc(n.id)}</small></div><svg viewBox="0 0 200 40" aria-hidden="true"><path d="M0 20H185m-15-10 15 10-15 10" fill="none" stroke="#96d6c8" stroke-width="3"/></svg></div><div><h3>Goes to</h3>${edgeButtons(outgoing,'out')}</div></div><details><summary>Every captured outgoing link / transition (${D.edges.filter(e=>e.from===n.id).length})</summary><div class="scroll"><table><thead><tr><th>Control</th><th>Destination</th><th>Evidence</th></tr></thead><tbody>${D.edges.filter(e=>e.from===n.id).map(e=>`<tr><td>${esc(e.label)}</td><td><button data-page="${e.to}">${esc(title(e.to))}</button><br><code>${esc(e.href)}</code></td><td class="${e.evidence==='broken'?'broken':''}">${esc(e.evidence)}</td></tr>`).join('')}</tbody></table></div></details></section>
<section class="card"><h3>Action tests</h3>${acts.length?acts.map(a=>`<p class="${a.status==='fail'?'broken':''}"><b>${esc(a.status.toUpperCase())}:</b> ${esc(a.name)} ${a.screenshot?`<a href="${esc(a.screenshot)}" target="_blank">Evidence</a>`:''}${a.error?`<br>${esc(a.error.split('\n')[0])}`:''}</p>`).join(''):'<p>See the functional review above for broader workflow-suite evidence. No separate focused action probe recorded for this page.</p>'}</section>
<section class="card"><h3>Captured states and controls</h3><label for="state">Choose a screen</label><select id="state">${rows.map((r,i)=>`<option value="${i}">${esc(D.manifest.screens.find(s=>s.id===r.screen).title+' · '+r.viewport)}</option>`).join('')}</select><div id="state-detail"></div></section>`;
$('#shared').onchange=e=>{shared=e.target.checked;render()};$('#state').onchange=()=>showState(rows[Number($('#state').value)]);showState(rows[0]);}
function showState(r){if(!r){$('#state-detail').textContent='No completed capture.';return}$('#state-detail').innerHTML=`<p><code>${esc(r.url)}</code></p>${r.issues.length?`<p class="broken">${esc(r.issues.join(' · '))}</p>`:'<p>Automated geometry/type checks recorded no finding here. That is not a full functional or accessibility pass.</p>'}<div class="gallery">${r.screenshots.map((f,i)=>`<div><p>${i===0?'Initial viewport':'Scrolled sample '+i}</p><a href="${esc(f)}" target="_blank"><img src="${esc(f)}" alt="${esc(r.screen+' '+r.viewport+' capture '+i)}" loading="lazy"></a></div>`).join('')}</div><details><summary>Rendered controls (${r.controls?.length||0})</summary><ul>${(r.controls||[]).map(c=>`<li>${esc(c.tag)} · ${esc(c.label||'[unnamed in DOM capture]')}${c.disabled?' · disabled':''}</li>`).join('')}</ul><p class="muted">This inventories controls, not successful transactions. Some early select labels include option text.</p></details><details><summary>Page text and headings</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit">${esc(r.text)}</pre></details>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)choose(b.dataset.page)});$('#search').oninput=catalogue;window.addEventListener('hashchange',()=>{const id=location.hash.replace('#page=','');if(D.nodes.some(n=>n.id===id)&&id!==selected){selected=id;render();catalogue()}});const initial=location.hash.replace('#page=','');if(D.nodes.some(n=>n.id===initial))selected=initial;catalogue();render();
</script></html>
